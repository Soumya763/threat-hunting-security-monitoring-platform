services:

  postgres:
    image: postgres:16
    container_name: threat-hunting-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: threat_hunting
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d threat_hunting"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Search and log analytics engine. OpenSearch is the project's engine; the
  # security plugin is disabled ONLY for this local development setup.
  opensearch:
    image: opensearchproject/opensearch:2.19.7
    container_name: threat-hunting-opensearch
    restart: unless-stopped
    environment:
      - cluster.name=threat-hunting
      - node.name=opensearch
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  logstash:
    # Logstash with the OpenSearch output plugin (the stock Elastic image's
    # elasticsearch output refuses to write to OpenSearch.)
    image: opensearchproject/logstash-oss-with-opensearch-output-plugin:8.9.0
    container_name: threat-hunting-logstash
    restart: unless-stopped
    depends_on:
      opensearch:
        condition: service_healthy
    ports:
      - "5044:5044"
      - "5000:5000"
      - "5001:5001/udp"
      - "5004:5004/udp"
      - "5002:5002/udp"
      - "5003:5003/udp"
    volumes:
      - ./logstash/config.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./logstash/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro
      - ./logstash/pipelines:/usr/share/logstash/pipeline:ro
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"

  postgres_admin:
    image: dpage/pgadmin4:8
    container_name: threat-hunting-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  # Optional application container. Start with: docker compose --profile app up --build
  # The default `docker compose up` (infrastructure only) is unchanged.
  backend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: threat-hunting-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      OPENSEARCH_HOST: http://opensearch:9200
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  opensearch_data: