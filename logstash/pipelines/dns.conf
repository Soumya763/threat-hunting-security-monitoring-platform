input {
  udp {
    port => 5004
    type => "dns_query"
  }
}

filter {
  if [type] == "dns_query" {

    grok {
      match => {
        "message" => [
          "query:\s+(?<dns_query>[\w\-.]+)\s+(?<query_type_raw>\w+)\s+IN\s+(?<client_ip>\d+\.\d+\.\d+\.\d+)",
          "query:\s+(?<dns_query>[\w\-.]+)\s+IN\s+(?<query_type_raw>\w+)\s+from\s+(?<client_ip>\d+\.\d+\.\d+\.\d+)"
        ]
      }
      tag_on_failure => ["_dns_grok_failure"]
    }

    mutate {
      uppercase => ["query_type_raw"]

      add_field => {
        "event_category" => "network"
        "event_action" => "query"
        "source_type" => "dns"
        "log_source" => "syslog"
        "protocol" => "UDP"
        "source.ip" => "%{client_ip}"
        "dns.query" => "%{dns_query}"
        "dns.query_type" => "%{query_type_raw}"
      }
    }

    if [dns_query] =~ /(?i)(malware|c2|trojan|ransomware|botnet|phishing|exploit|suspicious)/ {
      mutate {
        add_field => {
          "event_type" => "dns_query_suspicious"
          "severity" => "medium"
        }
      }
    } else {
      mutate {
        add_field => {
          "event_type" => "dns_query_benign"
          "severity" => "low"
        }
      }
    }

    mutate {
      add_field => {
        "source_name" => "NS-01"
      }

      remove_field => [
        "dns_query",
        "query_type_raw",
        "client_ip"
      ]
    }
  }
}

output {
  if [type] == "dns_query" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "events-dns-%{+YYYY.MM.dd}"
    }

    stdout {
      codec => rubydebug
    }
  }
}