input {
  udp {
    port => 5001
    type => "firewall_syslog"
  }
}

filter {
  if [type] == "firewall_syslog" {

    grok {
      match => {
        "message" => "^<%{NUMBER:syslog_priority}>%{MONTH:month} +%{MONTHDAY:day} %{TIME:time} %{HOSTNAME:source_name} %{DATA:process}: %{WORD:event_action} %{WORD:protocol} %{IP:source_ip}:%{NUMBER:source_port} -> %{IP:destination_ip}:%{NUMBER:destination_port}"
      }
    }

    mutate {
      lowercase => [ "event_action" ]
      uppercase => [ "protocol" ]

      add_field => {
        "event_category" => "network"
        "source_type" => "firewall"
        "log_source" => "syslog"
        "source.ip" => "%{source_ip}"
        "source.port" => "%{source_port}"
        "destination.ip" => "%{destination_ip}"
        "destination.port" => "%{destination_port}"
      }
    }

    if [event_action] == "drop" or [event_action] == "deny" or [event_action] == "block" or [event_action] == "reject" {
      mutate {
        add_field => {
          "event_type" => "firewall_connection_denied"
          "severity" => "medium"
        }
      }
    } else if [event_action] == "allow" or [event_action] == "pass" {
      mutate {
        add_field => {
          "event_type" => "firewall_connection_allowed"
          "severity" => "low"
        }
      }
    }

    mutate {
      convert => {
        "source.port" => "integer"
        "destination.port" => "integer"
      }
    }
  }
}

output {
  if [type] == "firewall_syslog" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "events-firewall-%{+YYYY.MM.dd}"
    }

    stdout {
      codec => rubydebug
    }
  }
}
