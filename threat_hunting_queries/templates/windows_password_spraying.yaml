# One source IP failing logons against many different accounts.
name: "Password Spraying - Failed Logons Across Many Accounts from One IP"
description: >
  A single source IP produces failed Windows logons for several distinct
  usernames within 15 minutes. Spraying one or two common passwords across
  many accounts avoids per-account lockout, so it is detected by counting
  distinct accounts per source rather than failures per account.
mitre_tactic: "TA0006 - Credential Access"
mitre_technique: "T1110.003 - Brute Force: Password Spraying"
severity: high
index: "events-windows-*"
query:
  bool:
    filter:
      - term:
          event_type.keyword: "windows_login_failed"
      - range:
          "@timestamp":
            gte: "now-15m"
            lte: "now"
  aggs:
    by_source_ip:
      terms:
        field: "source_ip.keyword"
        size: 50
      aggs:
        distinct_users:
          cardinality:
            field: "username.keyword"
threshold:
  aggregation: "distinct_users"
  min_count: 4
  window_minutes: 15
  entity_type: "ip"
