# Denied connections from one source to many destination ports.
name: "Network Scan - Denied Connections to Many Ports from One Source"
description: >
  A single internal or external source has firewall-denied connections to
  many distinct destination ports within 15 minutes. This pattern matches a
  port scan, which is a reconnaissance step before exploitation.
mitre_tactic: "TA0043 - Reconnaissance"
mitre_technique: "T1046 - Network Service Discovery"
severity: medium
index: "events-firewall-*"
query:
  bool:
    filter:
      - term:
          event_type.keyword: "firewall_connection_denied"
      - range:
          "@timestamp":
            gte: "now-15m"
            lte: "now"
  aggs:
    by_source_ip:
      terms:
        field: "source.ip.keyword"
        size: 50
      aggs:
        distinct_ports:
          cardinality:
            field: "destination.port"
threshold:
  aggregation: "distinct_ports"
  min_count: 10
  window_minutes: 15
  entity_type: "ip"
