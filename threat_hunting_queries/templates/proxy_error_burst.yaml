# Many HTTP 4xx/5xx responses through the proxy for one client.
name: "Web Enumeration - Burst of HTTP Errors from One Client"
description: >
  One client IP receives at least ten proxy error responses (status 400 or
  above) within 10 minutes. Repeated errors on different paths are typical
  of directory or endpoint enumeration, or of a broken client looping.
mitre_tactic: "TA0043 - Reconnaissance"
mitre_technique: "T1595.003 - Active Scanning: Wordlist Scanning"
severity: medium
index: "events-proxy-*"
query:
  bool:
    filter:
      - term:
          event_type.keyword: "proxy_request_error"
      - range:
          "@timestamp":
            gte: "now-10m"
            lte: "now"
  aggs:
    by_source_ip:
      terms:
        field: "source.ip.keyword"
        size: 50
threshold:
  aggregation: "_count"
  min_count: 10
  window_minutes: 10
  entity_type: "ip"
