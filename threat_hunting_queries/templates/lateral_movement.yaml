# Detection rule schema:
#   name             - short human-readable rule name
#   description      - what the rule detects and why it matters
#   mitre_tactic     - MITRE ATT&CK tactic (ID + name)
#   mitre_technique  - MITRE ATT&CK technique (ID + name)
#   severity         - low | medium | high | critical
#   index            - OpenSearch index pattern to query
#   query            - OpenSearch Query DSL (filters + aggregations)
#   threshold        - condition on the aggregation result. Keys:
#       aggregation             - sub-aggregation name holding the metric, or "_count"
#       min_count               - alert when the metric is >= this value
#       window_minutes          - time window used for duplicate suppression
#       entity_type             - user | ip | domain | host (what the bucket key is)
#       source_ip_aggregation   - optional sub-aggregation (terms, size 1) giving
#                                 the top source IP for the entity

name: "Lateral Movement - Multiple Host Logins by Single User"

description: >
  Detects a single user account successfully authenticating (windows_login)
  to multiple distinct hosts within a short time window. One account
  logging into several machines in quick succession is a common signal of
  an attacker moving laterally through the network after initial compromise.

mitre_tactic: "TA0008 - Lateral Movement"
mitre_technique: "T1021 - Remote Services"

severity: high

index: "events-windows-*"

query:
  bool:
    filter:
      - term:
          event_type.keyword: "windows_login"
      - range:
          "@timestamp":
            gte: "now-15m"
            lte: "now"
  aggs:
    by_user:
      terms:
        field: "username.keyword"
        size: 50
      aggs:
        distinct_hosts:
          cardinality:
            field: "source_name.keyword"
        top_source_ip:
          terms:
            field: "source_ip.keyword"
            size: 1

threshold:
  aggregation: "distinct_hosts"
  min_count: 3
  window_minutes: 15
  entity_type: "user"
  source_ip_aggregation: "top_source_ip"
